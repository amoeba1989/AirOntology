name: Deploy AirOntology to ECS
run-name: Deploy ${{ github.sha }} to ECS (${{ inputs.architecture }})
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: ECS CPU架构（uname -m为x86_64选amd64，为aarch64选arm64）
        type: choice
        options: [amd64, arm64]
        default: amd64
        required: true
      run_simulator:
        description: 部署后启动无人机模拟器（数量由服务器配置决定）
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: airontology-ecs-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET_ARCH: ${{ inputs.architecture }}
      RUN_SIMULATOR: ${{ inputs.run_simulator }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          for name in ECS_HOST ECS_USER ECS_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then echo "Missing repository secret: $name"; exit 1; fi
          done
          if [[ -z "$ECS_SSH_KEY" && -z "$ECS_PASSWORD" ]]; then
            echo 'Missing ECS_SSH_KEY or ECS_PASSWORD secret'; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend and deployment scripts
        run: |
          pip install -r backend/requirements-dev.txt
          PYTHONPATH=backend python -m pytest backend/tests -q -n 2 --durations=5
          bash -n scripts/deploy-ecs.sh scripts/publish-ecs.sh
          python scripts/test_deploy.py
          python -m py_compile scripts/maintain-ecs.py
      - name: Test frontend
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund && npm test
      - name: Prepare container configuration
        run: cp .env.example .env && docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build images with cache
        uses: docker/bake-action@v7
        env:
          VITE_TILE_URL: ${{ vars.VITE_TILE_URL }}
          VITE_TILE_ATTRIBUTION: ${{ vars.VITE_TILE_ATTRIBUTION }}
          VITE_ARCGIS_TOKEN: ${{ vars.VITE_ARCGIS_TOKEN }}
        with:
          source: .
          files: compose.yaml
          targets: app,fuseki
          load: true
          set: |
            app.cache-from=type=gha,scope=app-${{ runner.arch }},version=2
            app.cache-to=type=gha,scope=app-${{ runner.arch }},version=2,mode=max,ignore-error=true,timeout=60s
            fuseki.cache-from=type=gha,scope=fuseki-${{ runner.arch }},version=2
            fuseki.cache-to=type=gha,scope=fuseki-${{ runner.arch }},version=2,mode=max,ignore-error=true,timeout=60s
      - name: Verify full services
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose --profile demo up -d --no-build simulator
          python scripts/smoke.py
      - name: Package exact tested images
        run: |
          mkdir -p bundle/deploy
          docker tag airontology-app:local "airontology-app:$GITHUB_SHA"
          docker tag "$(docker compose images -q fuseki)" "airontology-fuseki:$GITHUB_SHA"
          docker tag eclipse-mosquitto:2.0.22 "airontology-mqtt:$GITHUB_SHA"
          printf 'APP_IMAGE=airontology-app:%s\nFUSEKI_IMAGE=airontology-fuseki:%s\nMQTT_IMAGE=airontology-mqtt:%s\n' "$GITHUB_SHA" "$GITHUB_SHA" "$GITHUB_SHA" > bundle/images.env
          COMPRESSOR=(gzip -1)
          if command -v pigz >/dev/null; then COMPRESSOR=(pigz -1 -p 2); fi
          docker save "airontology-app:$GITHUB_SHA" "airontology-fuseki:$GITHUB_SHA" "airontology-mqtt:$GITHUB_SHA" | "${COMPRESSOR[@]}" > bundle/images.tar.gz
          cp deploy/compose.ecs.yaml bundle/compose.ecs.yaml
          cp deploy/mosquitto.conf bundle/deploy/mosquitto.conf
          cp scripts/maintain-ecs.py bundle/deploy/maintain-ecs.py
          cp .env.example bundle/.env.example
          tar -cf bundle.tar -C bundle .
      - name: Install password login helper
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          if [[ -z "$ECS_SSH_KEY" ]] && ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
          fi
      - name: Upload and deploy through verified SSH
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          ECS_PORT: ${{ vars.ECS_PORT }}
          ECS_DEPLOY_PATH: ${{ vars.ECS_DEPLOY_PATH }}
        run: bash scripts/publish-ecs.sh
      - name: Build logs
        if: always()
        run: docker compose --profile demo logs --tail=50
      - name: Clean runner containers
        if: always()
        run: docker compose --profile demo down
