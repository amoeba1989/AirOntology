name: Verify AirOntology
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
      - run: bash -n scripts/deploy-ecs.sh scripts/publish-ecs.sh start-local.sh start-local.command && python scripts/test_deploy.py
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose build && docker compose up -d --wait --wait-timeout 180
      - run: docker compose --profile demo up -d simulator
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose --profile demo logs --tail=100
      - if: always()
        run: docker compose --profile demo down
