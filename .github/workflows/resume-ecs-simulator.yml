name: Resume ECS simulator
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airontology-ecs-production
  cancel-in-progress: false
jobs:
  resume:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install SSH password helper
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
          fi
      - name: Resume demo observations
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          ECS_PORT: ${{ vars.ECS_PORT }}
          ECS_DEPLOY_PATH: ${{ vars.ECS_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          umask 077
          DIR=$(mktemp -d)
          trap 'rm -rf "$DIR"' EXIT
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$DIR/known_hosts"
          OPT=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$DIR/known_hosts" -o ConnectTimeout=20)
          AUTH=()
          if [[ -n "${ECS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$ECS_SSH_KEY" > "$DIR/key"
            chmod 600 "$DIR/key"
            OPT+=(-i "$DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes)
          else
            export SSHPASS="$ECS_PASSWORD"
            AUTH=(sshpass -e)
            OPT+=(-o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1)
          fi
          ROOT=${ECS_DEPLOY_PATH:-/opt/airontology}
          [[ "$ROOT" =~ ^/[A-Za-z0-9/_-]+$ && "$ROOT" != / ]] || exit 1
          printf -v COMMAND 'bash -s -- %q' "$ROOT"
          "${AUTH[@]}" ssh "${OPT[@]}" -p "${ECS_PORT:-22}" "$ECS_USER@$ECS_HOST" "$COMMAND" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=${1:?}
          [[ "$ROOT" =~ ^/[A-Za-z0-9/_-]+$ && "$ROOT" != / ]] || exit 1
          exec 9>"$ROOT/deploy.lock"
          flock -n 9 || { echo '另一部署正在运行'; exit 1; }
          RELEASE=$(readlink -f "$ROOT/current")
          ENV_FILE="$ROOT/shared/.env"
          [[ "$(docker inspect -f '{{.State.Health.Status}}' airontology-app-1)" == healthy ]]
          [[ "$(docker inspect -f '{{.State.Health.Status}}' airontology-fuseki-1)" == healthy ]]
          python3 - "$ENV_FILE" <<'PY'
          import os, pathlib, re, sys, tempfile
          path = pathlib.Path(sys.argv[1])
          lines = [line for line in path.read_text().splitlines()
                   if not re.match(r'^\s*DEMO_INTERVAL_SECONDS\s*=', line)]
          lines.append('DEMO_INTERVAL_SECONDS=15')
          fd, name = tempfile.mkstemp(prefix='.env.simulator.', dir=path.parent)
          try:
              with os.fdopen(fd, 'w') as stream: stream.write('\n'.join(lines) + '\n')
              os.chmod(name, 0o600)
              os.replace(name, path)
          finally:
              if os.path.exists(name): os.unlink(name)
          PY
          docker compose --profile demo --project-name airontology --project-directory "$RELEASE" \
            --env-file "$ENV_FILE" --env-file "$RELEASE/images.env" -f "$RELEASE/compose.ecs.yaml" \
            up -d --no-deps --force-recreate --wait --wait-timeout 120 simulator
          sleep 35
          [[ "$(docker inspect -f '{{.State.Health.Status}}' airontology-app-1)" == healthy ]] || { docker stop airontology-simulator-1; echo 'Application unhealthy; simulator stopped'; exit 1; }
          [[ "$(docker inspect -f '{{.State.Health.Status}}' airontology-fuseki-1)" == healthy ]] || { docker stop airontology-simulator-1; echo 'Fuseki unhealthy; simulator stopped'; exit 1; }
          echo 'Simulator running at a 15-second interval; application and Fuseki healthy'
          REMOTE
