# 由GitHub构建镜像，ECS仅导入和运行；不要在此添加build。
name: airontology
x-app-env:
  MQTT_HOST: mqtt
  MQTT_PORT: 1883
  MQTT_TOPIC: counteruav/track/blue
  MQTT_REGISTRY_TOPIC: ${MQTT_REGISTRY_TOPIC:-counteruav/demo/devices}
  MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-counteruav/demo/telemetry}
  MQTT_OBSERVATION_TOPIC: ${MQTT_OBSERVATION_TOPIC:-counteruav/observation/raw}
  POSITION_ID: ${POSITION_ID:-pos001}
  POSITION_NAME: ${POSITION_NAME:-一号阵地}
  POSITION_LON: ${POSITION_LON:-116.4077}
  POSITION_LAT: ${POSITION_LAT:-39.9045}
services:
  mqtt:
    image: ${MQTT_IMAGE:?缺少MQTT_IMAGE}
    restart: unless-stopped
    volumes:
    - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - mqtt-data:/mosquitto/data
    healthcheck:
      test:
      - CMD
      - mosquitto_pub
      - -h
      - 127.0.0.1
      - -t
      - healthcheck
      - -m
      - ok
      interval: 10s
      timeout: 10s
      retries: 30
  fuseki:
    environment:
      JVM_ARGS: ${FUSEKI_JVM_ARGS:--Xms64m -Xmx512m -XX:ActiveProcessorCount=2}
    mem_limit: ${FUSEKI_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    volumes:
    - fuseki-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3030/$$/ping
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s
    image: ${FUSEKI_IMAGE:?缺少FUSEKI_IMAGE}
  app:
    image: ${APP_IMAGE:?缺少APP_IMAGE}
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: counteruav/track/blue
      MQTT_REGISTRY_TOPIC: ${MQTT_REGISTRY_TOPIC:-counteruav/demo/devices}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-counteruav/demo/telemetry}
      MQTT_OBSERVATION_TOPIC: ${MQTT_OBSERVATION_TOPIC:-counteruav/observation/raw}
      POSITION_ID: ${POSITION_ID:-pos001}
      POSITION_NAME: ${POSITION_NAME:-一号阵地}
      POSITION_LON: ${POSITION_LON:-116.4077}
      POSITION_LAT: ${POSITION_LAT:-39.9045}
      FUSEKI_URL: http://fuseki:3030/counteruav
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AMAP_JS_KEY: ${AMAP_JS_KEY:-}
      AMAP_SECURITY_JS_CODE: ${AMAP_SECURITY_JS_CODE:-}
      STALE_SECONDS: ${STALE_SECONDS:-30}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-300}
      HIGH_THRESHOLD: ${HIGH_THRESHOLD:-100}
      MEDIUM_THRESHOLD: ${MEDIUM_THRESHOLD:-200}
      LOW_THRESHOLD: ${LOW_THRESHOLD:-300}
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8092}:8000
    depends_on:
      mqtt:
        condition: service_healthy
      fuseki:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health'));
        assert d['status']=='ok'
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 90s
  simulator:
    image: ${APP_IMAGE:?缺少APP_IMAGE}
    profiles:
    - demo
    restart: unless-stopped
    command:
    - python
    - /app/simulator/main.py
    environment:
      # 小规格ECS默认10架；如资源允许，可在shared/.env调整为16。
      DEMO_TARGET_COUNT: ${DEMO_TARGET_COUNT:-10}
      DEMO_INTERVAL_SECONDS: ${DEMO_INTERVAL_SECONDS:-2}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: counteruav/track/blue
      MQTT_REGISTRY_TOPIC: ${MQTT_REGISTRY_TOPIC:-counteruav/demo/devices}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-counteruav/demo/telemetry}
      POSITION_ID: ${POSITION_ID:-pos001}
      POSITION_NAME: ${POSITION_NAME:-一号阵地}
      POSITION_LON: ${POSITION_LON:-116.4077}
      POSITION_LAT: ${POSITION_LAT:-39.9045}
    depends_on:
      app:
        condition: service_healthy
volumes:
  mqtt-data: null
  fuseki-data: null
